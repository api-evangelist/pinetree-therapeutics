aid: pinetree-therapeutics
name: PineTree Therapeutics
description: 'Pinetree Therapeutics, Inc. is a preclinical-stage biotechnology company headquartered
  at West Cambridge Scientific Park, 767C Concord Ave, Cambridge, Massachusetts, developing
  next-generation targeted protein degraders (TPDs) built on its proprietary AbReptor platform. AbReptor
  degrades membrane-bound and extracellular proteins through target co-engagement, induced endocytosis,
  endolysosome formation and lysosomal degradation, aiming to overcome drug resistance and tumor
  recurrence in oncology, with additional application in inflammation and immunology. The company is
  advancing trispecific degraders and ADC-integrated programs, closed a $17M Series A in July 2024, and
  has entered a licensing partnership with AstraZeneca. It is a therapeutics developer rather than a
  software vendor: it publishes no public API, developer portal, SDK or machine-readable specification.'
